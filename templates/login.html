{% extends "base.html" %}
{% block title %}Log in — JobShield{% endblock %}

{% block content %}
<main id="main" class="auth-page animate-fade-in">
  <div class="auth-card card">
    <h1 class="auth-heading">Log in</h1>
    <p class="auth-sub">Use the email and password you registered with.</p>
    <form method="post" action="{{ url_for('login_post') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      {% if next_url %}
      <input type="hidden" name="next" value="{{ next_url }}" />
      {% endif %}
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p class="auth-footer">
      No account? <a href="{{ url_for('signup') }}">Sign up</a>
    </p>
  </div>
</main>
{% endblock %}
